services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: securepassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    depends_on:
      - db
    entrypoint: >
      sh -c "sleep 5 && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: wallet_db
      DB_USER: wallet_user
      DB_PASSWORD: securepassword
    ports:
      - "8000:8000"

volumes:
  postgres_data:
